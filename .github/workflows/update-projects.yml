name: Update Latest Projects

on:
  schedule:
    # Every 6 hours
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with latest projects
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Rebuild latest projects section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          gh api "users/${PROFILE}/repos?per_page=100&sort=pushed" > /tmp/repos.json
          python3 update_projects.py

      - name: Commit README
        run: |
          if git diff --quiet README.md; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "🔄 Update README with latest projects"
          git push
