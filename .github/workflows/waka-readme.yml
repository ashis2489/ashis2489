name: Waka Readme

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    name: Update README With Waka Time Stats
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_OS: "True"
          SHOW_PROJECTS: "True"
          SHOW_EDITORS: "True"
          SHOW_LANGUAGE: "True"
          SHOW_LANGUAGE_PER_REPO: "True"
          SHOW_LINES_OF_CODE: "True"
          SHOW_COMMIT: "True"
          SHOW_DAYS_OF_WEEK: "True"
          SHOW_SHORT_INFO: "True"
          SHOW_LOC_CHART: "True"

# ─────────────────────────────────────────────────────────────────────────────
# SETUP:
#   1. Create a WakaTime account at https://wakatime.com
#   2. Install the WakaTime plugin in VS Code
#   3. Go to: https://wakatime.com/api-key  → copy your API key
#   4. In your GitHub repo → Settings → Secrets → Actions
#      Add secret: WAKATIME_API_KEY = <your key>
#   5. Also add: GH_TOKEN = <a GitHub personal access token with repo scope>
# ─────────────────────────────────────────────────────────────────────────────
